name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check i18n parity (DE/EN must have identical keys)
        run: node scripts/check-i18n-parity.js
      - run: npm run lint
      - run: npm test -- --passWithNoTests

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test -- --passWithNoTests
